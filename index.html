  <style>
/* ============================================================
   LATINOO MAX — عشرائي (ashrai)
   Classic luxury redesign
   Warm ivory / cream surfaces, deep espresso dark sections,
   restrained champagne-gold accents, elegant serif display type.
   Smoothness first: soft easing, staggered reveals, stable grids.
   ============================================================ */

:root {
  --font-body: 'Cairo', Tahoma, Arial, sans-serif;
  --font-display: 'Amiri', 'Playfair Display', Georgia, 'Times New Roman', serif;
  --font-latin: 'Playfair Display', Georgia, serif;

  /* classic luxury palette */
  --ivory: #f7f1e3;
  --ivory-2: #f1e8d2;
  --paper: #fffdf6;
  --cream: #f6ead6;
  --ink: #2a1c0e;
  --ink-soft: #4a3823;
  --espresso: #20140a;
  --charcoal: #17100a;
  --gold: #a9852f;
  --gold-bright: #c9a227;
  --gold-soft: #e7d6a4;
  --gold-faint: #f0e3bd;
  --line: #e2d5b8;
  --line-dark: #3d2c18;
  --muted: #7d6c52;
  --muted-light: #b8a888;
  --danger: #a13e24;
  --danger-bg: #fbe8e0;

  /* legacy variable names kept so older rules/components still resolve */
  --green: var(--ink);
  --orange: var(--gold);
  --mint: var(--ivory-2);

  --ease: cubic-bezier(.22, .61, .36, 1);
  --ease-soft: cubic-bezier(.33, 1, .68, 1);
  --shadow-soft: 0 10px 30px rgba(42, 28, 14, .10);
  --shadow-lift: 0 18px 40px rgba(42, 28, 14, .16);
  --radius: 18px;
  --radius-sm: 12px;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 110px;
}

body {
  margin: 0;
  font-family: var(--font-body);
  line-height: 1.7;
  color: var(--ink);
  background:
    radial-gradient(ellipse 900px 380px at 50% -80px, rgba(201, 162, 39, .14), transparent 70%),
    var(--ivory);
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select, a { font: inherit; }
button, a { touch-action: manipulation; }
button { cursor: pointer; border: 0; background: none; color: inherit; }
button:disabled { cursor: not-allowed; opacity: .55; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--gold-bright);
  outline-offset: 3px;
  border-radius: 6px;
}

h1, h2, h3, .brand b, .foot-brand {
  font-family: var(--font-display);
  font-weight: 700;
  line-height: 1.4;
}

::selection { background: var(--gold-soft); color: var(--ink); }

/* ---------- motion: reveal on scroll + staggered entrances ---------- */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes shimmer {
  from { background-position: 200% 0; }
  to { background-position: -200% 0; }
}
@keyframes toastIn {
  from { opacity: 0; transform: translate(-50%, 14px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}
@keyframes slideUp {
  from { opacity: 0; transform: translate(-50%, 24px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

.reveal { opacity: 0; transform: translateY(22px); transition: opacity .6s var(--ease), transform .6s var(--ease); }
.reveal.in { opacity: 1; transform: translateY(0); }

/* grid cards enter with a soft stagger; --d is set inline per card */
.grid .card { animation: fadeUp .5s var(--ease) both; animation-delay: var(--d, 0ms); }
.grid { content-visibility: auto; }

/* ---------- eyebrow / section furniture ---------- */
.eyebrow {
  color: var(--gold);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  margin: 0 0 6px;
}
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
  margin-bottom: 22px;
}
.section-head h2 { font-size: clamp(24px, 3vw, 32px); margin: 0; color: var(--ink); }
.section-head h2::after {
  content: "";
  display: block;
  width: 56px;
  height: 2px;
  background: linear-gradient(90deg, var(--gold-bright), transparent);
  margin-top: 10px;
  border-radius: 2px;
}
.muted { color: var(--muted); font-size: 12px; }

/* ---------- buttons ---------- */
.primary, .secondary, .accent {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px 22px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 13px;
  line-height: 1.6;
  letter-spacing: .2px;
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease), color .25s var(--ease);
}
.primary:active, .secondary:active, .accent:active { transform: scale(.97); }
.primary { background: var(--ink); color: var(--cream); box-shadow: 0 6px 18px rgba(42, 28, 14, .22); }
.primary:hover { background: #3a2812; transform: translateY(-2px); box-shadow: 0 12px 26px rgba(42, 28, 14, .26); }
.secondary { background: var(--paper); color: var(--ink); border: 1px solid var(--gold); }
.secondary:hover { background: var(--gold-faint); transform: translateY(-2px); }
.accent { background: linear-gradient(135deg, var(--gold-bright), var(--gold)); color: #fff; box-shadow: 0 8px 22px rgba(169, 133, 47, .35); }
.accent:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(169, 133, 47, .42); }
.bubble {
  background: var(--gold-bright);
  color: var(--charcoal);
  padding: 1px 10px;
  border-radius: 30px;
  font-size: 12px;
  font-weight: 800;
}
.lang-toggle {
  background: transparent;
  color: var(--gold-soft);
  border: 1px solid rgba(201, 162, 39, .55);
  border-radius: 999px;
  padding: 9px 16px;
  font-weight: 800;
  font-size: 12px;
  white-space: nowrap;
  transition: background .25s var(--ease), color .25s var(--ease), transform .25s var(--ease);
}
.lang-toggle:hover { background: rgba(201, 162, 39, .18); transform: translateY(-1px); }

/* ---------- header: dark, sticky, gains blur + shadow on scroll ---------- */
header, .menu-header {
  position: sticky;
  top: 0;
  z-index: 20;
  max-width: none;
  margin: auto;
  padding: 16px max(24px, calc((100% - 1280px) / 2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  background: linear-gradient(180deg, #241708, #1a1108);
  border-bottom: 1px solid rgba(201, 162, 39, .35);
  transition: box-shadow .3s var(--ease), background .3s var(--ease), padding .3s var(--ease);
}
header.scrolled, .menu-header.scrolled {
  box-shadow: 0 10px 30px rgba(23, 16, 10, .35);
  background: rgba(26, 17, 8, .92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding-top: 11px;
  padding-bottom: 11px;
}
header::after, .menu-header::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-bright) 20%, var(--gold-bright) 80%, transparent);
  opacity: .7;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand b { font-size: 19px; letter-spacing: 1px; color: var(--cream); }
.brand small { display: block; font-size: 11px; color: var(--muted-light); margin-top: 4px; font-family: var(--font-body); }
.brand-plaque { display: flex; align-items: center; background: transparent; border: 0; padding: 0; box-shadow: none; }
.brand-logo { display: block; width: 230px; height: auto; transition: transform .3s var(--ease); }
.brand:hover .brand-logo { transform: scale(1.02); }
.logo {
  font-family: var(--font-latin);
  font-weight: 700;
  font-size: 34px;
  color: var(--charcoal);
  background: var(--gold-soft);
  padding: 5px 14px;
  border-radius: 12px;
  direction: ltr;
}
.logo span { color: var(--gold); font-size: 22px; margin-left: 2px; }
.greeting { display: inline-flex; align-items: center; justify-content: center; gap: 7px; color: var(--muted-light); font-size: 12px; white-space: nowrap; }
.greeting svg { color: var(--gold-bright); flex: none; }

/* ---------- layout ---------- */
main { max-width: 1280px; margin: auto; padding: 0 28px; }
.loading {
  padding: 25vh 20px;
  text-align: center;
  font-family: var(--font-display);
  font-size: 26px;
  line-height: 2;
  color: var(--ink);
  letter-spacing: 1px;
  animation: fadeIn .6s var(--ease) both;
}
.loading::after {
  content: "";
  display: block;
  width: 180px;
  height: 4px;
  margin: 18px auto 0;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--gold-soft), var(--gold-bright), var(--gold-soft));
  background-size: 200% 100%;
  animation: shimmer 1.6s linear infinite;
}

/* ---------- hero: dark classic panel with gold frame ---------- */
.hero {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  background:
    radial-gradient(circle at 82% 18%, rgba(201, 162, 39, .22), transparent 55%),
    linear-gradient(135deg, #2b1a0c, #17100a);
  color: #f7f1e0;
  border: 1px solid rgba(201, 162, 39, .45);
  outline: 1px solid rgba(201, 162, 39, .18);
  outline-offset: 6px;
  border-radius: 26px;
  overflow: hidden;
  min-height: 400px;
  margin: 26px 0 52px;
  box-shadow: var(--shadow-soft);
  animation: fadeUp .7s var(--ease) both;
}
.hero > div:first-child { padding: 46px 44px; display: flex; flex-direction: column; align-items: flex-start; }
.hero .eyebrow { color: var(--gold-bright); font-family: var(--font-body); letter-spacing: 3px; }
.hero h1 {
  font-size: clamp(34px, 4.2vw, 54px);
  font-weight: 700;
  line-height: 1.45;
  max-width: 480px;
  margin: 18px 0 14px;
  color: #fffaf0;
}
.hero p:not(.eyebrow) { max-width: 400px; font-size: 14px; color: #e6d9bd; margin-bottom: 24px; }
.hero-note { font-size: 11px; color: var(--muted-light); margin-top: 26px; letter-spacing: .5px; }
.hero-photo { position: relative; min-height: 320px; background: #2d1e14; overflow: hidden; }
.hero-photo > img {
  width: 100%; height: 100%;
  position: absolute; object-fit: cover;
  transition: transform 1.2s var(--ease-soft);
}
.hero:hover .hero-photo > img { transform: scale(1.05); }
.hero-photo::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(23, 16, 10, .55), transparent 55%);
}
.stamp {
  position: absolute;
  left: 24px; bottom: 24px;
  background: var(--ivory);
  color: var(--ink);
  width: 104px; height: 104px;
  display: grid; place-content: center;
  border-radius: 50%;
  border: 1px dashed var(--gold);
  outline: 5px solid var(--ivory);
  text-align: center;
  font-family: var(--font-latin);
  font-weight: 700;
  font-size: 12px;
  line-height: 1.5;
  letter-spacing: 1px;
  transform: rotate(-8deg);
  z-index: 1;
  box-shadow: var(--shadow-soft);
}

/* ---------- featured picks (hidden when empty) ---------- */
.featured {
  position: relative;
  border: 1px solid var(--line);
  background: linear-gradient(120deg, var(--paper), var(--ivory-2) 60%, var(--paper));
  border-radius: 26px;
  padding: 28px !important;
  margin-top: 28px;
  overflow: hidden;
  box-shadow: var(--shadow-soft);
}
.featured .eyebrow { color: var(--gold); }
.featured h2 { color: var(--ink); }
.feature-track {
  display: flex;
  gap: 18px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: thin;
  scrollbar-color: var(--gold) transparent;
  padding: 10px 2px 20px;
  overscroll-behavior-x: contain;
  scroll-behavior: smooth;
  touch-action: pan-x pan-y;
}
.feature-card {
  position: relative;
  flex: 0 0 330px;
  min-width: 0;
  min-height: 190px;
  display: flex !important;
  align-items: stretch;
  background: var(--espresso);
  color: #fff;
  border-radius: 20px;
  padding: 0 !important;
  overflow: hidden;
  scroll-snap-align: start;
  border: 1px solid rgba(201, 162, 39, .5);
  box-shadow: 0 8px 22px rgba(42, 28, 14, .18);
  text-align: right;
  isolation: isolate;
  transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
}
.feature-card:hover, .feature-card:focus-visible {
  transform: translateY(-5px);
  box-shadow: var(--shadow-lift);
  border-color: var(--gold-bright);
}
.feature-card > img, .feature-card > .placeholder {
  position: absolute !important;
  inset: 0 35% 0 0 !important;
  width: 65% !important;
  height: 100% !important;
  object-fit: cover !important;
  z-index: -2;
  transition: transform .6s var(--ease-soft);
}
.feature-card::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(270deg, var(--espresso) 5%, rgba(32, 20, 10, .92) 34%, rgba(32, 20, 10, .25) 100%);
}
.feature-copy {
  display: flex !important;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 11px;
  padding: 24px !important;
  max-width: 92%;
  width: 100%;
}
.feature-copy > small {
  color: var(--charcoal) !important;
  background: var(--gold-soft);
  border-radius: 30px;
  padding: 3px 12px;
  font-weight: 800;
  font-size: 10px;
}
.feature-copy > b { font-size: 19px; line-height: 1.7; max-width: 230px; text-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
.feature-copy > span { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--gold-soft); }
.feature-copy i { font-size: 10px !important; color: #f6ead6 !important; font-style: normal !important; border: 1px solid rgba(255, 255, 255, .45); border-radius: 25px; padding: 5px 10px; white-space: nowrap; }
.offer-spark { position: absolute; left: 16px; top: 9px; font-size: 30px; color: var(--gold-soft); transition: transform .5s var(--ease); }
.feature-card:hover .offer-spark { transform: rotate(90deg); }
.offer-controls { display: flex; align-items: center; gap: 8px; }
.offer-arrow {
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--gold);
  background: var(--paper);
  border-radius: 50%;
  width: 38px; height: 38px;
  color: var(--ink);
  font-size: 19px;
  padding: 0; line-height: 1;
  transition: background .25s var(--ease), color .25s var(--ease), transform .25s var(--ease);
}
.offer-arrow:hover { background: var(--ink); color: var(--gold-soft); transform: translateY(-1px); }
.offer-arrow::before { content: ""; width: 9px; height: 9px; border-top: 2px solid currentColor; border-right: 2px solid currentColor; }
.offer-arrow.offer-prev::before { transform: translateX(-3.25px) rotate(45deg); }
.offer-arrow.offer-next::before { transform: translateX(3.25px) rotate(-135deg); }
.offer-pagination { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 8px; }
.offer-bars { display: flex; align-items: center; gap: 5px; max-width: 75%; overflow: auto; padding: 5px 0; }
.offer-bars button { width: 18px; height: 5px; min-width: 18px; border-radius: 8px; padding: 0; background: #cbb98d; transition: width .25s var(--ease), background .25s var(--ease); }
.offer-bars button.current { width: 32px; background: var(--gold); }

/* ---------- demo offers showcase (SAMPLES ONLY — not orderable) ---------- */
.demo-offers { margin: 8px 0 52px; }
.demo-offers .section-head h2 { color: var(--ink); }
.demo-note {
  display: inline-block;
  margin-top: 10px;
  font-size: 11px;
  color: var(--muted);
  background: var(--gold-faint);
  border: 1px dashed var(--gold);
  border-radius: 999px;
  padding: 6px 14px;
}
.demo-track {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
  margin-top: 6px;
}
.demo-card {
  position: relative;
  background: var(--paper);
  border: 1px solid var(--gold);
  outline: 1px solid rgba(169, 133, 47, .25);
  outline-offset: 4px;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: var(--shadow-soft);
  display: flex;
  flex-direction: column;
  animation: fadeUp .55s var(--ease) both;
  animation-delay: var(--d, 0ms);
  transition: transform .3s var(--ease), box-shadow .3s var(--ease);
}
.demo-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lift); }
.demo-photo { position: relative; height: 190px; overflow: hidden; background: var(--ivory-2); }
.demo-photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease-soft); }
.demo-card:hover .demo-photo img { transform: scale(1.06); }
.demo-photo::after {
  content: "";
  position: absolute; inset: auto 0 0 0; height: 70px;
  background: linear-gradient(180deg, transparent, rgba(23, 16, 10, .45));
}
.demo-badge {
  position: absolute; top: 14px; inset-inline-start: 14px; z-index: 2;
  background: var(--ink);
  color: var(--gold-soft);
  border: 1px solid var(--gold-bright);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .5px;
}
.demo-body { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.demo-body h3 { font-size: 21px; margin: 0; color: var(--ink); }
.demo-includes { margin: 0; padding: 0; list-style: none; color: var(--ink-soft); font-size: 13px; line-height: 2; flex: 1; }
.demo-includes li::before { content: "✦ "; color: var(--gold); font-size: 11px; }
.demo-prices { display: flex; align-items: baseline; gap: 12px; margin-top: 6px; }
.demo-was { color: var(--muted); text-decoration: line-through; font-size: 14px; }
.demo-now { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--gold); }
.demo-save {
  font-size: 11px; font-weight: 800; color: var(--ink);
  background: var(--gold-soft); border-radius: 999px; padding: 3px 10px;
}
.demo-soon {
  margin-top: 12px;
  width: 100%;
  padding: 12px;
  border-radius: 999px;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-weight: 800;
  font-size: 13px;
  background: transparent;
  cursor: not-allowed;
}
.demo-soon:disabled { opacity: 1; }

/* ---------- menu: search, sections, filters ---------- */
.search {
  max-width: 360px;
  transition: border-color .25s var(--ease), box-shadow .25s var(--ease);
}
.search:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(201, 162, 39, .18); outline: none; }
.menu-layout { display: block; }
.categories {
  position: sticky;
  top: 74px;
  z-index: 5;
  background: rgba(247, 241, 227, .94);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  max-height: none;
  overflow: visible;
  margin-bottom: 20px;
  padding: 12px 0 14px;
  transition: box-shadow .3s var(--ease);
}
.menu-sections { display: flex; gap: 8px; }
.menu-sections button {
  flex: 1;
  text-align: center;
  font-weight: 800;
  font-size: 14px;
  padding: 12px 16px;
  border-radius: 999px;
  border: 1px solid var(--gold);
  background: var(--paper);
  color: var(--ink-soft);
  transition: background .25s var(--ease), color .25s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease);
}
.menu-sections button:hover { transform: translateY(-1px); border-color: var(--gold-bright); }
.menu-sections button.active {
  background: linear-gradient(135deg, #2a1c0e, #17100a);
  color: var(--gold-soft);
  box-shadow: 0 8px 20px rgba(42, 28, 14, .22);
}
.category-filter {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--gold) transparent;
  padding-top: 10px;
  scroll-behavior: smooth;
}
.category-filter button {
  display: block;
  width: auto;
  white-space: nowrap;
  flex-shrink: 0;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink-soft);
  padding: 8px 15px;
  border-radius: 999px;
  font-size: 12px;
  margin: 2px 0;
  transition: background .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease), transform .25s var(--ease);
}
.category-filter button:hover { border-color: var(--gold); transform: translateY(-1px); }
.category-filter button.active { background: var(--gold); color: #fff; border-color: var(--gold); box-shadow: 0 5px 14px rgba(169, 133, 47, .35); }
.results { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.results h3 { font-size: 20px; margin: 0; }
.results > span { font-size: 11px; color: var(--muted); letter-spacing: .5px; }

/* ---------- product grid & cards ---------- */
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
  align-items: stretch;
}
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-width: 0;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(42, 28, 14, .06);
  transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
  content-visibility: auto;
  contain-intrinsic-size: auto 330px;
}
.card:hover, .card:focus-visible {
  transform: translateY(-5px);
  box-shadow: var(--shadow-lift);
  border-color: var(--gold);
}
.card-photo {
  padding: 0;
  background: var(--ivory-2);
  height: 180px;
  position: relative;
  display: block;
  overflow: hidden;
  width: 100%;
}
.card-photo img {
  width: 100%; height: 100%;
  object-fit: cover;
  background: var(--ivory-2);
  transition: transform .7s var(--ease-soft);
}
.card:hover .card-photo img { transform: scale(1.07); }
.placeholder {
  height: 100%;
  display: grid;
  place-content: center;
  background: radial-gradient(circle, var(--gold-faint), var(--ivory-2));
  font-family: var(--font-latin);
  font-weight: 700;
  font-size: 45px;
  color: var(--gold);
  direction: ltr;
}
.placeholder span { font-size: 20px; }
.badge {
  position: absolute;
  top: 12px;
  inset-inline-start: 12px;
  border-radius: 20px;
  background: var(--gold);
  padding: 3px 12px;
  font-size: 10px;
  color: #fff;
  font-weight: 800;
  letter-spacing: .5px;
}
.card-body { padding: 16px 18px 18px; flex: 1; display: flex; flex-direction: column; }
.card-body small { font-size: 10px; color: var(--gold); font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; }
.card h3 { font-size: 17px; line-height: 1.6; margin: 6px 0 10px; color: var(--ink); }
.card-body .item-description {
  font-size: 12px;
  line-height: 1.7;
  color: var(--muted);
  margin: -4px 0 12px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-body:has(.item-description) h3 { margin-bottom: 8px; }
.card-bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: auto; }
.card-bottom strong { font-size: 17px; font-family: var(--font-display); color: var(--gold); }
.card-bottom strong .from { font-family: var(--font-body); font-size: 11px; color: var(--muted); margin-inline-end: 4px; }
.add {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; min-width: 36px;
  background: var(--ink);
  color: var(--gold-soft);
  border: 1px solid var(--ink);
  border-radius: 50%;
  padding: 0;
  line-height: 1;
  transition: background .25s var(--ease), color .25s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease);
}
.add:hover { background: var(--gold); border-color: var(--gold); color: #fff; transform: scale(1.1) rotate(90deg); box-shadow: 0 6px 16px rgba(169, 133, 47, .4); }
.add svg { display: block; flex: none; }
.detail-link {
  background: none;
  border-top: 1px solid var(--line);
  font-size: 11px;
  text-align: right;
  color: var(--gold);
  font-weight: 700;
  padding: 11px 0 0;
  margin-top: 14px;
  transition: color .2s var(--ease);
}
.detail-link:hover { color: var(--ink); }
.more { display: flex; margin: 26px auto; }
.empty {
  text-align: center;
  padding: 48px;
  border: 1px dashed var(--gold);
  border-radius: var(--radius);
  background: var(--paper);
  animation: fadeIn .4s var(--ease) both;
}

/* ---------- contacts & hours (dark classic panel) ---------- */
.contacts {
  max-width: 1280px;
  margin: 78px auto 0;
  padding: 44px;
  border-top: 1px solid var(--line);
  background: linear-gradient(180deg, #241708, #17100a);
  color: var(--cream);
  border-radius: 26px;
  border: 1px solid rgba(201, 162, 39, .35);
  box-shadow: var(--shadow-soft);
}
.contacts h2 { margin: 0; font-size: 28px; color: #fffaf0; }
.contacts .section-head h2::after { background: linear-gradient(90deg, var(--gold-bright), transparent); }
.contacts .eyebrow { color: var(--gold-bright); }
.contact-mark { display: block; height: 52px; width: auto; }
.branch-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 26px; }
.contacts .branch-grid { display: block; max-width: 760px; margin: 26px auto 0; }
.branch-card {
  background: rgba(255, 253, 246, .05);
  color: var(--cream);
  border: 1px solid rgba(201, 162, 39, .4);
  border-radius: 22px;
  padding: 26px 28px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
  transition: transform .3s var(--ease), border-color .3s var(--ease);
}
.branch-card:hover { transform: translateY(-3px); border-color: var(--gold-bright); }
.contacts .branch-card { padding: 30px; }
.branch-card h3 { display: flex; align-items: center; gap: 10px; font-size: 18px; line-height: 1.9; margin: 0 0 12px; flex-wrap: wrap; color: #fffaf0; }
.branch-dot { width: 8px; height: 8px; background: var(--gold-bright); border-radius: 50%; box-shadow: 0 0 0 5px rgba(201, 162, 39, .15); flex-shrink: 0; }
.branch-address { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #d8cbb0; line-height: 2; margin-bottom: 20px; }
.branch-address svg { flex-shrink: 0; margin-top: 2px; width: 19px; color: var(--gold-bright); }
.branch-phones { display: grid; gap: 10px; border-top: 1px solid rgba(255, 255, 255, .14); padding-top: 20px; }
.branch-phones .branch-actions { border: 0; padding: 0; }
.branch-actions { display: flex; gap: 8px; border-top: 1px solid rgba(255, 255, 255, .14); padding-top: 16px; }
.branch-call, .branch-whatsapp {
  display: flex; align-items: center; justify-content: center;
  border-radius: 12px; min-height: 52px;
  transition: background .25s var(--ease), transform .25s var(--ease);
}
.branch-call { flex: 1; gap: 12px; background: rgba(255, 255, 255, .07); font-size: 17px; }
.branch-call svg { color: var(--gold-bright); }
.branch-whatsapp { width: 58px; background: var(--gold-bright); color: var(--charcoal); flex-shrink: 0; }
.branch-call:hover { transform: translateY(-2px); background: rgba(255, 255, 255, .14); }
.branch-whatsapp:hover { transform: translateY(-2px); background: var(--gold-soft); }
.contacts-empty { color: var(--muted-light); padding: 20px; background: rgba(255, 255, 255, .05); border-radius: 12px; }

.hours { margin-top: 26px; padding: 22px 24px; background: rgba(255, 253, 246, .05); border: 1px solid rgba(201, 162, 39, .3); border-radius: 18px; }
.hours h3 { margin: 0 0 10px; font-size: 17px; color: #fffaf0; }
.hours table { width: 100%; border-collapse: collapse; font-size: 13px; }
.hours th, .hours td { padding: 9px 10px; text-align: start; border-bottom: 1px solid rgba(255, 255, 255, .12); vertical-align: top; color: #e6d9bd; }
.hours th { font-weight: 800; color: var(--gold-bright); width: 34%; }
.hours tr:last-child td { border-bottom: 0; }
.hours td small { display: block; color: var(--muted-light); font-size: 11px; }
.hours small { color: var(--muted-light); font-size: 11px; }
.hours p { margin: 10px 0 0; }

/* ---------- footer: classic dark panel ---------- */
footer {
  max-width: 1224px;
  margin: 70px auto 0;
  padding: 36px 28px 120px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}
footer > b { font-family: var(--font-display); font-size: 24px; color: var(--ink); }
footer a { text-decoration: underline; text-underline-offset: 3px; transition: color .2s var(--ease); }
footer a:hover { color: var(--gold); }
.foot-brand { display: inline-flex; align-items: center; gap: 12px; }
.foot-mark { height: 34px; width: auto; }
.credit { margin-top: 28px; padding-top: 28px; border-top: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
.credit-rights { margin: 0; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .5px; }
.credit-dev { margin: 0; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 13px; font-weight: 800; color: var(--ink); }
.credit-lockup { height: 46px; width: auto; display: block; }
.credit-link { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; background: var(--ivory-2); color: var(--ink); font-size: 12px; font-weight: 700; text-decoration: none; transition: transform .25s var(--ease), background .25s var(--ease); }
.credit-link:hover { transform: translateY(-2px); background: var(--gold-faint); }
.credit-link svg { width: 17px; height: 17px; }
.credit-wa { background: var(--ink) !important; color: var(--gold-soft) !important; }

/* ---------- floating cart bar & toast ---------- */
.floating {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  width: min(460px, calc(100% - 30px));
  background: linear-gradient(135deg, #2a1c0e, #17100a);
  color: var(--cream);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 16px 22px;
  border-radius: 999px;
  border: 1px solid rgba(201, 162, 39, .55);
  box-shadow: 0 14px 36px rgba(23, 16, 10, .4);
  z-index: 10;
  font-size: 13px;
  animation: slideUp .4s var(--ease) both;
  transition: transform .25s var(--ease), box-shadow .25s var(--ease);
}
.floating:hover { transform: translateX(-50%) translateY(-2px); box-shadow: 0 20px 44px rgba(23, 16, 10, .45); }
.floating b { background: var(--gold-bright); border-radius: 20px; color: var(--charcoal); padding: 2px 10px; margin-inline-end: 8px; }
.floating strong { color: var(--gold-soft); font-family: var(--font-display); font-size: 16px; }
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--gold-soft);
  border: 1px solid rgba(201, 162, 39, .5);
  z-index: 30;
  padding: 13px 16px 13px 22px;
  border-radius: 999px;
  font-size: 12px;
  max-width: calc(100% - 30px);
  box-shadow: 0 10px 30px rgba(23, 16, 10, .35);
  display: flex;
  align-items: center;
  gap: 12px;
  animation: toastIn .35s var(--ease) both;
}
.toast > span { flex: 1; }
.toast-close {
  background: rgba(255, 255, 255, .1);
  color: var(--gold-soft);
  font-size: 20px;
  line-height: 1;
  padding: 2px 9px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: background .2s var(--ease);
}
.toast-close:hover { background: rgba(255, 255, 255, .22); }

/* ---------- dialogs / product modal / cart ---------- */
dialog {
  border: 1px solid var(--gold);
  border-radius: 22px;
  padding: 26px;
  width: min(600px, calc(100% - 24px));
  max-height: 90dvh;
  overflow: auto;
  color: var(--ink);
  background: var(--paper);
  box-shadow: 0 30px 70px rgba(23, 16, 10, .4);
  animation: fadeUp .35s var(--ease) both;
}
dialog::backdrop { background: rgba(23, 16, 10, .72); backdrop-filter: blur(6px); }
.modal-head {
  display: flex; justify-content: space-between; gap: 15px; align-items: center;
  border-bottom: 1px solid var(--line);
  padding-bottom: 16px; margin-bottom: 18px;
}
.modal-head h2 { font-size: 22px; line-height: 1.5; margin: 0; }
.icon {
  background: var(--ivory-2);
  color: var(--ink);
  width: 36px; height: 36px;
  border-radius: 50%;
  flex-shrink: 0;
  display: grid; place-items: center;
  padding: 0;
  transition: background .25s var(--ease), transform .25s var(--ease);
}
.icon:hover { background: var(--gold-soft); transform: rotate(90deg); }
.detail-photo { width: 100%; height: 230px; object-fit: cover; border-radius: 16px; }
.full { width: 100%; margin-top: 18px; }
dialog .accent.full {
  position: sticky;
  bottom: 0;
  z-index: 2;
  color: #fff !important;
  box-shadow: 0 -14px 22px 6px var(--paper), 0 6px 24px rgba(0, 0, 0, .25);
}
.check { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 11px 0; transition: color .2s var(--ease); }
.check input { accent-color: var(--gold); width: 18px; height: 18px; flex-shrink: 0; }
.addon { border-bottom: 1px solid var(--line); }
.addon span { flex: 1; }
.addon b { font-size: 12px; white-space: nowrap; color: var(--gold); }
.check.size {
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  margin: 8px 0;
  font-size: 15px;
  font-weight: 700;
  background: var(--paper);
  transition: border-color .25s var(--ease), background .25s var(--ease), box-shadow .25s var(--ease), transform .25s var(--ease);
}
.check.size:hover { transform: translateY(-1px); border-color: var(--gold); }
.check.size input { width: 22px; height: 22px; }
.check.size b { font-size: 14px; color: var(--gold); }
.check.size.unavailable { border-style: dashed; border-color: var(--line); background: none; opacity: .55; }
.check.unavailable { opacity: .45; }
.check.unavailable input { cursor: not-allowed; }
.check:has(input:checked) { color: var(--ink); }
.check.size:has(input:checked) { background: var(--gold-faint); border-color: var(--gold); box-shadow: 0 0 0 1px rgba(201, 162, 39, .4); }
input[type="radio"], input[type="checkbox"] {
  -webkit-appearance: none; appearance: none;
  width: 22px; height: 22px; flex-shrink: 0; margin: 0;
  background: var(--paper);
  border: 2px solid #b39a5e;
  display: inline-grid; place-content: center;
  cursor: pointer;
  transition: background .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease);
}
input[type="radio"] { border-radius: 50%; }
input[type="checkbox"] { border-radius: 6px; }
input[type="radio"]::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #fff; transform: scale(0); transition: transform .15s var(--ease); }
input[type="checkbox"]::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 3px 3px 0; transform: translateY(-1px) rotate(45deg) scale(0); transition: transform .15s var(--ease); }
input[type="radio"]:checked, input[type="checkbox"]:checked { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201, 162, 39, .25); }
input[type="radio"]:checked::after { transform: scale(1); }
input[type="checkbox"]:checked::after { transform: translateY(-1px) rotate(45deg) scale(1); }
input[type="radio"]:disabled, input[type="checkbox"]:disabled { opacity: .4; cursor: not-allowed; }

.cart-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; margin-bottom: 10px; }
.clear-cart { padding: 8px 14px; background: var(--danger-bg); color: var(--danger); border: 1px solid #efc5b7; border-radius: 999px; font-weight: 700; transition: background .2s var(--ease); }
.clear-cart:hover { background: #f2d5c8; }
.cart-lines { animation: fadeIn .35s var(--ease) both; }
.cart-line {
  border-bottom: 1px solid var(--line);
  padding: 16px 0;
  display: flex; justify-content: space-between; gap: 18px;
  font-size: 13px;
  animation: fadeUp .35s var(--ease) both;
}
.cart-line p { margin: 5px 0; }
.cart-line > div:last-child { text-align: left; white-space: nowrap; }
.qty { direction: ltr; display: inline-flex; align-items: center; gap: 14px; margin-top: 8px; }
.qty button {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--ivory-2);
  color: var(--ink);
  border: 1px solid var(--gold);
  font-size: 18px;
  transition: background .2s var(--ease), transform .2s var(--ease);
}
.qty button:hover { background: var(--gold); color: #fff; transform: scale(1.08); }
.qty span { min-width: 20px; text-align: center; font-weight: 800; transition: transform .2s var(--ease); }
.danger { display: block; background: none; color: var(--danger); font-size: 11px; padding: 8px 0; }
.total { display: flex; justify-content: space-between; font-size: 20px; font-weight: 800; margin: 20px 0; font-family: var(--font-display); }
.total.fee { font-size: 15px; margin: 8px 0; font-family: var(--font-body); color: var(--ink-soft); }
.notice { background: var(--gold-faint); color: #6b4d12; font-size: 12px; padding: 13px 16px; border-radius: 12px; line-height: 1.9; border: 1px dashed var(--gold); }
.order-types { display: flex; gap: 12px; margin: 15px 0; }
.order-types label {
  display: flex; align-items: center; gap: 8px;
  padding: 13px 14px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  font-size: 13px; flex: 1;
  background: var(--paper);
  transition: border-color .25s var(--ease), background .25s var(--ease);
}
.order-types label:has(input:checked) { border-color: var(--gold); background: var(--gold-faint); }
.disabled { color: #999; background: var(--ivory-2); }
.field { display: block; font-size: 12px; margin: 13px 0; font-weight: 700; color: var(--ink-soft); }
.field input, .field textarea, .field select { margin-top: 6px; font-weight: 400; }
input:not([type="checkbox"]):not([type="radio"]), textarea, select {
  display: block;
  background: var(--paper);
  color: var(--ink);
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  width: 100%;
  font-size: 13px;
  min-width: 0;
  transition: border-color .25s var(--ease), box-shadow .25s var(--ease);
}
input:not([type="checkbox"]):not([type="radio"]):focus, textarea:focus, select:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 4px rgba(201, 162, 39, .16);
  outline: none;
